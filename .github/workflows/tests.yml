name: tests
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements-dev.txt pip-audit
      - run: python -m pytest -q --junitxml=junit.xml
        working-directory: backend
      - if: failure()
        run: python scripts/ci_annotate.py junit.xml           # failed tests show up as annotations on the run
        working-directory: backend
      - run: pip-audit -r requirements.txt
        working-directory: backend

  # The same store tests against real PostgreSQL (what Render runs), not only SQLite.
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: store, POSTGRES_PASSWORD: store, POSTGRES_DB: store_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U store" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://store:store@localhost:5432/store_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements-dev.txt
      - run: >-
          python -m pytest -q
          tests/test_orders.py tests/test_cart.py tests/test_inventory.py tests/test_products.py tests/test_catalogue_zm.py
          tests/test_flutterwave.py tests/test_store_risk.py tests/test_catalogue_admin.py tests/test_app_repo.py
          tests/test_store_ml.py tests/test_store_model.py tests/test_fraud_api.py
          tests/test_investigations.py tests/test_reports_admin.py tests/test_security_events.py
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --omit=dev
        working-directory: frontend
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, backend-postgres, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m app.ml.train_model --synthetic    # the model file is not committed
        working-directory: backend
      - run: npm ci && npx playwright install --with-deps chromium && npx playwright test
        working-directory: frontend
